<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>grasp review</title>
<style>
:root{
  --bg:#f5f6f8;--card:#fff;--ink:#15171c;--mute:#646b77;--line:#e0e4ea;--soft:#eef1f5;
  --accent:#3b5bdb;--ok:#2b8a3e;--okbg:#e7f5ea;--bad:#c92a2a;--badbg:#fdeded;--warn:#b35c00;--warnbg:#fff4e2;
  --add:#e7f5ea;--addink:#1e6b30;--del:#fdeded;--delink:#a61e1e;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115;--card:#181b21;--ink:#e9ebef;--mute:#9aa2ae;--line:#2a2f38;--soft:#21252d;
  --accent:#7d95ff;--ok:#69db7c;--okbg:#15291a;--bad:#ff8787;--badbg:#351a1a;--warn:#ffa94d;--warnbg:#33250f;
  --add:#15291a;--addink:#8ce99a;--del:#351a1a;--delink:#ffa8a8;
}}
:root[data-theme="dark"]{
  --bg:#0f1115;--card:#181b21;--ink:#e9ebef;--mute:#9aa2ae;--line:#2a2f38;--soft:#21252d;
  --accent:#7d95ff;--ok:#69db7c;--okbg:#15291a;--bad:#ff8787;--badbg:#351a1a;--warn:#ffa94d;--warnbg:#33250f;
  --add:#15291a;--addink:#8ce99a;--del:#351a1a;--delink:#ffa8a8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 48px}
header{display:flex;align-items:center;gap:12px;padding:14px 0}
.logo{font-weight:750;font-size:20px;letter-spacing:-.02em}
select{margin-left:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;max-width:260px;font-size:14px}
.tabs{display:flex;gap:6px;background:var(--soft);padding:4px;border-radius:12px;width:max-content;margin:4px 0 18px}
.tab{border:0;background:none;padding:7px 18px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--mute)}
.tab.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.ask{display:flex;gap:10px;align-items:baseline;color:var(--mute);margin-bottom:14px}
.ask span{white-space:nowrap}
.ask b{color:var(--ink);font-weight:600;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:20px}
.dot{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;font-weight:700;cursor:pointer;transition:transform .2s,background .3s,border-color .3s;font-size:15px}
.dot:hover{transform:scale(1.08)}
.dot.on{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 20%,transparent)}
.dot.approved{background:var(--ok);border-color:var(--ok);color:#fff}
.dot.rejected{background:var(--bad);border-color:var(--bad);color:#fff}
.dot.warn{border-color:var(--warn);color:var(--warn);border-style:dashed}
.dot.lit{animation:lit .9s ease-out}
@keyframes lit{0%{transform:scale(1.35)}100%{transform:scale(1)}}
.progress{margin-left:auto;font-size:14px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.in{animation:in .35s ease-out}
@keyframes in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.kind{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--mute)}
.kind .ico{font-size:20px}
h1{font-size:28px;line-height:1.25;margin:10px 0 10px;letter-spacing:-.01em}
.why{font-size:18px;color:var(--mute);margin:0 0 6px}
.status{display:inline-block;border-radius:999px;padding:3px 12px;font-size:14px;font-weight:600;margin-left:8px}
.status.approved{background:var(--okbg);color:var(--ok)}.status.rejected{background:var(--badbg);color:var(--bad)}
svg.map{width:100%;height:auto;display:block;margin:18px 0 6px}
.map text{fill:var(--ink);font-size:14px}.map .sub{fill:var(--mute);font-size:12px}
.arrow{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-dasharray:400;stroke-dashoffset:400;animation:draw .7s ease-out forwards}
.arrow.claim{stroke:var(--warn);stroke-dasharray:6 6;animation:none;stroke-dashoffset:0}
@keyframes draw{to{stroke-dashoffset:0}}
.pop{opacity:0;animation:pop .4s ease-out forwards}
@keyframes pop{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.note{border-radius:12px;padding:10px 14px;margin:10px 0;font-size:15px}
.note.warn{background:var(--warnbg);color:var(--warn)}
.note.info{background:var(--soft);color:var(--mute)}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.big{flex:1;min-width:150px;border:0;border-radius:14px;padding:16px;font-size:18px;font-weight:700;cursor:pointer;transition:transform .1s}
.big:active{transform:scale(.98)}
.big.ok{background:var(--ok);color:#fff}.big.bad{background:var(--bad);color:#fff}
.big.ghost{background:var(--soft);color:var(--ink);flex:0 0 auto;min-width:0;font-size:15px;padding:16px 18px}
.more{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.link{border:1px solid var(--line);background:none;border-radius:10px;padding:8px 14px;cursor:pointer;font-size:14px;color:var(--mute)}
.link:hover{color:var(--ink);border-color:var(--accent)}
.box{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.box h4{margin:12px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
.box ul{margin:0;padding-left:20px}
.diff{border:1px solid var(--line);border-radius:10px;margin:10px 0;overflow:hidden}
.diff .hd{padding:6px 12px;background:var(--soft);font:13px ui-monospace,Menlo,monospace}
.diff pre{margin:0;padding:6px 0;font:12.5px/1.5 ui-monospace,Menlo,monospace;overflow:auto;max-height:300px}
.diff .l{display:block;padding:0 12px;white-space:pre}.diff .gap{color:var(--mute);background:var(--soft);font-style:italic}.diff .a{background:var(--add);color:var(--addink)}.diff .d{background:var(--del);color:var(--delink)}
textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:12px;background:var(--soft);padding:10px 12px;resize:vertical;font-size:16px}
.ask-reject{margin-top:16px}
.ask-reject p{margin:0 0 8px;font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 16px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
input.name{border:1px solid var(--line);border-radius:10px;background:var(--soft);padding:7px 10px;width:150px}
.comment{background:var(--soft);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:15px}.comment .who{font-size:12px;color:var(--mute)}
.done{text-align:center;padding:40px 28px}
.done .big-ico{font-size:56px}
.done h1{margin:8px 0}
.done p{color:var(--mute);font-size:18px}
.tally{display:flex;justify-content:center;gap:28px;margin:20px 0;font-size:16px}
.tally b{display:block;font-size:34px}
pre.fb{text-align:left;white-space:pre-wrap;background:var(--soft);padding:14px;border-radius:12px;font-size:13px;max-height:300px;overflow:auto}
.player{min-height:320px;display:flex;flex-direction:column;justify-content:center}
.past{color:var(--mute);opacity:.55;font-size:15px;margin:4px 0;display:flex;gap:10px}
.now{display:flex;gap:16px;align-items:flex-start;margin:18px 0}
.now .ico{font-size:40px;line-height:1}
.now .txt{font-size:24px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.now .txt small{display:block;font-size:15px;font-weight:400;color:var(--mute);margin-top:6px}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-top:18px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.controls{display:flex;gap:10px;align-items:center;margin-top:16px}
.controls .step{margin-left:auto;color:var(--mute);font-size:14px}
.ev{border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0}
.ev .t{font-weight:700;margin-bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ev .pair{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
@media (max-width:640px){.ev .pair{grid-template-columns:1fr}.ev .to{transform:rotate(90deg);justify-self:center}}
.side{border-radius:10px;padding:8px 10px;min-width:0}
.side .lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.side.before{background:var(--soft)}.side.before .lbl{color:var(--mute)}
.side.after{background:var(--okbg)}.side.after .lbl{color:var(--ok)}
.side.after.same{background:var(--warnbg)}.side.after.same .lbl{color:var(--warn)}
.side pre{margin:0;font:13px/1.45 ui-monospace,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:180px;overflow:auto}
.side .skip{font-style:italic;color:var(--mute);font-size:14px}
.ev .to{align-self:center;font-size:22px;color:var(--accent)}
.ev .foot{margin-top:8px;font-size:13px;color:var(--mute);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.ev .foot .okk{color:var(--ok);font-weight:600}.ev .foot .bad{color:var(--warn);font-weight:600}
.ev details summary{cursor:pointer}
.ev.click{cursor:pointer}.ev.click:hover{border-color:var(--accent)}
.lead{font-size:18px;color:var(--mute);margin:0 0 6px}
.reveal{border:2px dashed var(--accent);border-radius:10px;background:none;color:var(--accent);font-weight:700;cursor:pointer;padding:12px;font-size:15px;width:100%;height:100%;min-height:90px}
.reveal:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.expect{margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:15px}
.expect b{font-weight:600}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600}
.pill:hover{border-color:var(--accent)}
.answered{font-size:14px;margin-top:8px}.answered.ok{color:var(--ok)}.answered.bad{color:var(--warn)}
h2.sec{font-size:20px;margin:28px 0 4px}
.risk{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:12px;padding:12px 14px;margin:12px 0}
.risk .t{font-weight:600}
.risk ul{margin:8px 0 0;padding-left:0;list-style:none}
.risk li{font:13px/1.5 ui-monospace,Menlo,monospace;padding:3px 0;overflow-wrap:anywhere}
.risk li span{color:var(--mute)}
.calm{border-left-color:var(--ok)}
.reel{position:relative;height:480px;border-radius:20px;overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--accent) 10%,var(--card)),var(--card) 70%)}
.bars{position:absolute;top:12px;left:14px;right:14px;display:flex;gap:3px;z-index:3}
.bars i{flex:1;height:4px;border-radius:2px;background:color-mix(in srgb,var(--ink) 12%,transparent);overflow:hidden}
.bars b{display:block;height:100%;width:0;background:var(--accent)}
.bars b.full{width:100%}.bars b.run{animation:fill var(--d) linear forwards}
.reel.paused .bars b.run{animation-play-state:paused}
@keyframes fill{to{width:100%}}
.beat{position:absolute;top:26px;left:16px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);z-index:3}
.stage{position:absolute;inset:52px 22px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.tap{position:absolute;top:40px;bottom:0;z-index:2;cursor:pointer}.tap.left{left:0;width:28%}.tap.right{right:0;width:72%}
.sc{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:640px}
.cap{font-size:15px;color:var(--mute);font-weight:600;animation:fadeup .5s .2s both}
.chat{flex-direction:row;align-items:flex-end;justify-content:center}
.av{font-size:40px;animation:popin .4s both}
.bubble{max-width:520px;border-radius:20px;padding:14px 18px;font-size:19px;line-height:1.45;text-align:left;box-shadow:0 4px 18px rgba(0,0,0,.06)}
.bubble.me{background:var(--accent);color:#fff;border-bottom-left-radius:6px;min-height:52px;min-width:120px}
.bubble.ai{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.caret::after{content:"▍";animation:blink .8s steps(1) infinite;margin-left:1px}
@keyframes blink{50%{opacity:0}}
.up{animation:fadeup .6s both}
@keyframes fadeup{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.drop{font-size:80px;animation:drop .8s cubic-bezier(.3,1.6,.5,1) both}
@keyframes drop{from{opacity:0;transform:translateY(-120px)}to{opacity:1;transform:none}}
.flip{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 30px;box-shadow:0 10px 30px rgba(0,0,0,.08);animation:flip .7s cubic-bezier(.2,.8,.3,1.2) both;max-width:600px;text-align:center}
@keyframes flip{from{opacity:0;transform:perspective(800px) rotateY(80deg) scale(.9)}to{opacity:1;transform:none}}
.flip .big-ico{font-size:52px}.klabel{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin-top:6px}
.dtitle{font-size:26px;font-weight:750;line-height:1.25;margin:8px 0}
.dwhy{font-size:17px;color:var(--mute)}
.later{animation:fadeup .6s 1.1s both}
.file{font-size:18px;font-weight:600;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 16px;max-width:100%;overflow-wrap:anywhere}
.newb{font-size:12px;background:var(--okbg);color:var(--ok);border-radius:999px;padding:2px 8px;margin-left:6px}
.pop1{animation:popin .45s both}
@keyframes popin{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.tally2{display:flex;gap:18px;font:700 28px ui-monospace,Menlo,monospace}.tally2 .add{color:var(--ok)}.tally2 .del{color:var(--bad)}
.code{width:100%;max-width:620px;background:var(--soft);border-radius:12px;padding:8px 0;font:13.5px/1.6 ui-monospace,Menlo,monospace;text-align:left;min-height:40px}
.cl{padding:0 14px;white-space:pre;overflow:hidden;text-overflow:ellipsis}
.cl.in{background:var(--add);color:var(--addink);animation:slidein .45s both}
.cl.out{background:var(--del);color:var(--delink);animation:slideout .45s both;text-decoration:line-through}
.cl.more{color:var(--mute);animation:fadeup .4s both}
@keyframes slidein{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes slideout{from{opacity:0;transform:translateX(-40px)}to{opacity:.85;transform:none}}
.term{width:100%;max-width:600px;background:#14161b;color:#e6e6e6;border-radius:14px;overflow:hidden;text-align:left;box-shadow:0 10px 30px rgba(0,0,0,.15);animation:popin .4s both}
.tbar{display:flex;gap:6px;padding:10px 12px;background:#20232a}.tbar i{width:10px;height:10px;border-radius:50%;background:#555}
.tbar i:nth-child(1){background:#ff5f57}.tbar i:nth-child(2){background:#febc2e}.tbar i:nth-child(3){background:#28c840}
.tline{padding:14px 16px 6px;font:14px/1.5 ui-monospace,Menlo,monospace;overflow-wrap:anywhere;min-height:44px}
.tres{padding:4px 16px 16px;font:700 16px ui-monospace,Menlo,monospace;animation-delay:2.4s}
.tres.ok{color:#69db7c}.tres.fail{color:#ff8787;animation:fadeup .4s 2.4s both,shake .5s 2.8s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.btitle{font-size:20px;font-weight:700;animation:fadeup .5s both}
.bpair{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;width:100%;max-width:700px;align-items:center}
.bside{border-radius:14px;padding:10px 12px;text-align:left;min-width:0}
.bside.before{background:var(--soft);animation-delay:.3s}.bside.after{background:var(--okbg)}
.bside .lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}.bside.after .lbl{color:var(--ok)}
.bside pre{margin:6px 0 0;font:12.5px/1.45 ui-monospace,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:150px;overflow:hidden}
.barrow{font-size:30px;color:var(--accent);animation:fadeup .4s 1.2s both}
.slide{animation:slidein .6s 1.8s both}
@media (max-width:640px){.bpair{grid-template-columns:1fr}.barrow{transform:rotate(90deg)}.reel{height:520px}.dtitle{font-size:21px}.bubble{font-size:16px}}
@media (prefers-reduced-motion:reduce){.reel *{animation-duration:.01s!important;animation-delay:0s!important}}
code{font:0.9em ui-monospace,Menlo,monospace;background:var(--soft);padding:1px 6px;border-radius:6px}
.empty{text-align:center;color:var(--mute);padding:60px 20px}
.keys{margin-top:14px;font-size:13px;color:var(--mute);text-align:center}
.k{font:12px ui-monospace,Menlo,monospace;background:var(--soft);border:1px solid var(--line);border-radius:5px;padding:0 6px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">grasp</div>
    <select id="sessions" aria-label="Session"></select>
  </header>
  <div class="tabs"><button class="tab on" data-tab="review">Review</button><button class="tab" data-tab="watch">Watch</button></div>
  <div class="ask" id="ask"></div>
  <div class="strip" id="strip"></div>
  <div id="main"></div>
  <div class="keys" id="keys">Keys: <span class="k">←</span> <span class="k">→</span> move · <span class="k">a</span> approve · <span class="k">r</span> reject</div>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KINDS = {architecture:["🏛","Architecture"],"data-model":["🗃","Data model"],api:["🔌","API"],"business-rule":["📏","Business rule"],
  dependency:["📦","New dependency"],security:["🔒","Security"],performance:["⚡","Performance"],testing:["🧪","Tests"],quality:["✨","Code quality"],other:["•","Change"]};
const UNEXPLAINED = "__unexplained__", OVERVIEW = "__overview__";
const reviewable = d => !d.unexplained && !d.overview;
const expected = id => R[id] ? R[id].expected : undefined;
const surprised = d => S.behaviors.some(b => b.decision_id === d.id && expected(b.id) === false);
let I = { tests: [], ripples: [] }, revealed = new Set();
let S = null, R = {}, items = [], idx = 0, tab = "review", sessionId = "", open = "";
let watch = { pos: 0, timer: null, speed: 1, anim: null, ended: false };
let me = ""; try { me = localStorage.getItem("grasp.name") || ""; } catch {}

// Short headline: the first clause of what the agent wrote.
function short(t) {
  t = String(t || "").replace(/\s+/g, " ").trim();
  for (const sep of [": ", "; ", " (", " — ", " - ", ", "]) { const i = t.indexOf(sep); if (i > 14) { t = t.slice(0, i); break; } }
  return t.length > 64 ? t.slice(0, 62).replace(/\s\S*$/, "") + "…" : t;
}
function firstSentence(t) {
  t = String(t || "").replace(/\s+/g, " ").trim();
  const m = t.match(/^(.{20,}?[.!?])\s/); t = m ? m[1] : t;
  return t.length > 170 ? t.slice(0, 168).replace(/\s\S*$/, "") + "…" : t;
}
const lines = s => s ? String(s).split("\n").length : 0;
const verdict = id => (R[id] && R[id].verdict) || "";

async function load(keep) {
  const list = await (await fetch("api/sessions")).json();
  if (!list.length) { $("#main").innerHTML = `<div class="card empty">No sessions yet.<br><br>Run <code>grasp init</code> and work with Claude Code here,<br>or <code>grasp import --latest</code>.</div>`; return; }
  if (!sessionId || !list.some(s => s.id === sessionId)) sessionId = list[0].id;
  $("#sessions").innerHTML = list.map(s => `<option value="${esc(s.id)}" ${s.id === sessionId ? "selected" : ""}>${esc(short(s.title || s.id))}</option>`).join("");
  const res = await (await fetch("api/session?id=" + encodeURIComponent(sessionId))).json();
  S = res.session; R = res.reviews || {};
  S.events = S.events || []; S.decisions = S.decisions || []; S.unexplained = S.unexplained || [];
  S.behaviors = S.behaviors || [];
  try { I = await (await fetch("api/impact?id=" + encodeURIComponent(sessionId))).json(); } catch { I = { tests: [], ripples: [] }; }
  I.tests = I.tests || []; I.ripples = I.ripples || [];
  items = S.decisions.slice().sort((a, b) => a.seq - b.seq);
  if (S.behaviors.length || items.length) items.unshift({ id: OVERVIEW, overview: true, title: "What changed for users", seq: 0 });
  if (S.unexplained.length) items.push({ id: UNEXPLAINED, kind: "other", title: "Changes with no reason given", edits: S.unexplained,
    files: [...new Set(S.unexplained.map(s => S.events[s - 1].file))], unexplained: true, seq: Math.min(...S.unexplained) });
  if (!keep) { idx = firstPending(); watch.pos = 0; }
  idx = Math.min(idx, items.length);
  render();
}

function firstPending() { if (items[0] && items[0].overview && !items.some(d => reviewable(d) && verdict(d.id))) return 0; const i = items.findIndex(d => reviewable(d) && !verdict(d.id)); return i < 0 ? items.length : i; }

function render() {
  const prompt = S.events.find(e => e.kind === "prompt");
  $("#ask").innerHTML = prompt ? `<span>You asked</span><b title="${esc(prompt.text)}">${esc(prompt.text)}</b>` : "";
  renderStrip();
  $("#keys").style.display = tab === "review" ? "" : "none";
  if (tab === "watch") return renderWatch();
  if (idx >= items.length) return renderDone();
  if (items[idx].overview) return renderOverview();
  renderCard(items[idx]);
}

function renderStrip(lit) {
  const rev = items.filter(reviewable);
  const done = rev.filter(d => verdict(d.id)).length;
  $("#strip").innerHTML = items.map((d, i) => {
    const v = d.unexplained ? "warn" : verdict(d.id);
    const n = items.slice(0, i + 1).filter(x => !x.overview).length;
    const label = d.overview ? "👁" : d.unexplained ? "?" : (v === "approved" ? "✓" : v === "rejected" ? "✗" : n);
    return `<button class="dot ${v} ${tab === "review" && i === idx ? "on" : ""} ${lit === d.id ? "lit" : ""}" data-i="${i}" title="${esc(short(d.title))}">${label}</button>`;
  }).join("") + `<span class="progress">${done} of ${rev.length} reviewed</span>`;
  document.querySelectorAll(".dot").forEach(b => b.onclick = () => { tab = "review"; setTab(); stopPlay(); idx = +b.dataset.i; open = ""; render(); });
}

function mapSVG(d) {
  const edits = (d.edits || []).map(s => S.events[s - 1]);
  const per = {};
  for (const e of edits) { const p = per[e.file] = per[e.file] || { add: 0, del: 0, isNew: false }, c = counts(e); p.add += c.add; p.del += c.del; p.isNew = p.isNew || e.new_file; }
  const files = Object.keys(per).map(f => ({ f, ...per[f] })).concat((d.unverified || []).filter(f => !per[f]).map(f => ({ f, claim: true })));
  if (!files.length) return "";
  const rowH = 46, H = Math.max(files.length * rowH, 70), W = 720, k = KINDS[d.kind] || KINDS.other;
  let s = `<svg class="map" viewBox="0 0 ${W} ${H}" role="img" aria-label="Files this decision changed">`;
  s += `<rect x="0" y="${H/2-28}" width="190" height="56" rx="14" fill="var(--soft)" stroke="${d.unexplained ? "var(--warn)" : "var(--accent)"}" stroke-width="2"/>
        <text x="20" y="${H/2+7}" style="font-size:22px">${k[0]}</text><text x="52" y="${H/2+5}" style="font-weight:600">${d.unexplained ? "No reason" : esc(k[1])}</text>`;
  files.forEach((x, i) => {
    const y = rowH * i + rowH / 2 + (H - files.length * rowH) / 2, delay = (i * 0.12).toFixed(2);
    s += `<path class="arrow ${x.claim ? "claim" : ""}" style="animation-delay:${delay}s" d="M190,${H/2} C300,${H/2} 330,${y} 420,${y}"/>`;
    const name = x.f.length > 30 ? "…" + x.f.slice(-29) : x.f;
    const sub = x.claim ? "named, but never changed" : x.isNew ? `new file · ${x.add} lines` : `+${x.add}  −${x.del} lines`;
    s += `<g class="pop" style="animation-delay:${(0.25 + i * 0.12).toFixed(2)}s"><rect x="420" y="${y-19}" width="300" height="38" rx="10" fill="var(--card)" stroke="${x.claim ? "var(--warn)" : "var(--line)"}" ${x.claim ? 'stroke-dasharray="5 4"' : ""}/>
      <text x="436" y="${y-1}" style="font-family:ui-monospace,Menlo,monospace;font-size:13px">${esc(name)}</text><text class="sub" x="436" y="${y+13}">${sub}</text></g>`;
  });
  return s + "</svg>";
}

// diffOps compares two texts line by line (longest common subsequence) and
// returns [kind, line] pairs: " " unchanged, "-" removed, "+" added.
function diffOps(a, b) {
  a = a ? String(a).split("\n") : []; b = b ? String(b).split("\n") : [];
  if (a.length * b.length > 4e6) return a.map(l => ["-", l]).concat(b.map(l => ["+", l]));
  const n = a.length, m = b.length, t = Array.from({ length: n + 1 }, () => new Uint32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) t[i][j] = a[i] === b[j] ? t[i + 1][j + 1] + 1 : Math.max(t[i + 1][j], t[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < n && j < m) { if (a[i] === b[j]) { out.push([" ", a[i]]); i++; j++; } else if (t[i + 1][j] >= t[i][j + 1]) out.push(["-", a[i++]]); else out.push(["+", b[j++]]); }
  while (i < n) out.push(["-", a[i++]]); while (j < m) out.push(["+", b[j++]]);
  return out;
}
const opsCache = new Map();
function ops(e) { if (!opsCache.has(e)) opsCache.set(e, diffOps(e.new_file ? "" : e.before, e.after)); return opsCache.get(e); }
function counts(e) { let add = 0, del = 0; for (const [k] of ops(e)) { if (k === "+") add++; else if (k === "-") del++; } return { add, del }; }

function diffHTML(e) {
  // show changed lines with 2 lines of context, collapsing long unchanged runs
  const o = ops(e), keep = o.map(() => false);
  o.forEach(([k], i) => { if (k !== " ") for (let j = Math.max(0, i - 2); j <= Math.min(o.length - 1, i + 2); j++) keep[j] = true; });
  let html = "", skipped = 0, shown = 0;
  o.forEach(([k, l], i) => {
    if (!keep[i]) { skipped++; return; }
    if (skipped) { html += `<span class="l gap">⋯ ${skipped} unchanged line${skipped > 1 ? "s" : ""}</span>`; skipped = 0; }
    if (shown++ > 200) return;
    html += `<span class="l ${k === "+" ? "a" : k === "-" ? "d" : ""}">${k === " " ? " " : k} ${esc(l)}</span>`;
  });
  if (skipped) html += `<span class="l gap">⋯ ${skipped} unchanged line${skipped > 1 ? "s" : ""}</span>`;
  const c = counts(e);
  return `<div class="diff"><div class="hd">${esc(e.file)} · ${e.new_file ? "new file" : `+${c.add} −${c.del}`}</div><pre>${html}</pre></div>`;
}

function firstLines(t, n) { const l = String(t || "").split("\n"); return l.length > n ? l.slice(0, n).join("\n") + `\n… ${l.length - n} more lines` : l.join("\n"); }
function sideHTML(r, cls, label, maxLines) {
  if (r.skipped) return `<div class="side ${cls}"><div class="lbl">${label}</div><div class="skip">Not run: ${esc(r.skipped)}</div></div>`;
  const extra = r.timed_out ? " · stopped (too slow)" : r.exit ? ` · exit code ${r.exit}` : "";
  return `<div class="side ${cls}"><div class="lbl">${label}${extra}</div><pre>${esc(firstLines(String(r.output || "").replace(/\r/g, "") || "(printed nothing)", maxLines))}</pre></div>`;
}
function behaviorHTML(b, opts = {}) {
  const same = !b.changed && !b.before?.skipped;
  const ran = b.after && (b.after.millis || b.after.output !== undefined);
  const lines = opts.lines || 8;
  const foot = !ran ? `<span class="bad">⚠ grasp has no output for this example</span>`
    : same ? `<span class="bad">⚠ Same output before and now: this example shows no change</span>`
    : `<span class="okk">✓ grasp ran this on the old and the new code</span>`;
  return `<div class="ev">
    <div class="t">🔬 ${esc(b.title)}${opts.click && b.decision_id ? ` <button class="link" data-go="${esc(b.decision_id)}" style="margin-left:auto;padding:3px 10px">its decision →</button>` : ""}</div>
    ${ran ? `<div class="pair">${sideHTML(b.before || {}, "before", "Before", lines)}<div class="to">→</div>${
      opts.predict && !shownNow(b) ? `<button class="reveal" data-reveal="${esc(b.id)}">🤔 What will the new code print?<br><span style="font-weight:400">Think about it, then tap to see</span></button>`
      : sideHTML(b.after || {}, "after" + (same ? " same" : ""), "Now", lines)}</div>` : ""}
    ${opts.predict && ran && shownNow(b) ? (expected(b.id) === undefined
      ? `<div class="expect"><b>Was that what you expected?</b><button class="pill" data-exp="${esc(b.id)}" data-v="1">👍 Yes</button><button class="pill" data-exp="${esc(b.id)}" data-v="0">😮 No, it surprised me</button></div>`
      : expected(b.id) ? `<div class="answered ok">👍 You expected this.</div>` : `<div class="answered bad">😮 This surprised you. Its decision is flagged so you look closer before approving.</div>`) : ""}
    <div class="foot">${foot}${b.expect && !(opts.predict && !shownNow(b)) ? `<span>Agent expected: ${esc(b.expect)}</span>` : ""}
      ${opts.click ? "" : `<details><summary>How it was run</summary><code>${esc(b.command)}</code></details>`}</div></div>`;
}

const shownNow = b => revealed.has(b.id) || expected(b.id) !== undefined;

function riskHTML() {
  const name = id => { const d = S.decisions.find(d => d.id === id); return d ? short(d.title) : ""; };
  let h = "";
  for (const t of I.tests) h += `<div class="risk"><div class="t">🧪 It changed an existing test: <code>${esc(t.file)}</code></div>
      <div style="color:var(--mute);margin-top:4px">${t.removed_checks ? `${t.removed_checks} check${t.removed_checks > 1 ? "s" : ""} removed. ` : ""}Make sure the test still checks the right thing and wasn't changed just to make the code pass.</div>
      <button class="link" data-testdiff="${esc(t.file)}" style="margin-top:8px">${open === "t:" + t.file ? "Hide" : "See"} the test change</button>
      ${open === "t:" + t.file ? t.edits.map(s => diffHTML(S.events[s - 1])).join("") : ""}</div>`;
  const loud = I.ripples.filter(r => !r.added_only), quiet = I.ripples.filter(r => r.added_only);
  for (const r of loud) h += `<div class="risk"><div class="t">🔗 <code>${esc(r.symbol)}</code> ${r.removed ? "was deleted" : "was changed"}${name(r.decision) ? ` (${esc(name(r.decision))})` : ""}</div>
      <div style="color:var(--mute);margin-top:4px">${r.removed ? "It is still used here, so this code may no longer build or run:" : `It is also used here, in code that wasn't changed. These places now get the new behavior:`}</div>
      <ul>${r.uses.map(u => `<li><span>${esc(u.file)}:${u.line}</span>  ${esc(u.text)}</li>`).join("")}</ul></div>`;
  if (quiet.length) h += `<div class="risk calm"><div class="t">➕ Added to shared code (usually safe)</div>
      <div style="color:var(--mute);margin-top:4px">Lines were only added here, nothing existing was changed. Worth a glance if other code relies on the exact shape.</div>
      <ul>${quiet.map(r => `<li><span>${esc(r.file)}</span>  ${esc(r.symbol)} <span>· used in ${r.uses.length}${r.uses.length >= 8 ? "+" : ""} other place${r.uses.length > 1 ? "s" : ""}</span></li>`).join("")}</ul></div>`;
  if (!h) h = I.note ? `<div class="note info">Couldn't check: ${esc(I.note)}.</div>`
    : `<div class="risk calm"><div class="t">✓ Nothing found</div><div style="color:var(--mute);margin-top:4px">No existing tests were changed, and nothing else in the project uses the changed code (searched ${I.searched} file${I.searched === 1 ? "" : "s"}).</div></div>`;
  return h;
}

function renderOverview() {
  const bs = S.behaviors.slice().sort((a, b) => a.seq - b.seq);
  $("#main").innerHTML = `<div class="card in">
    <span class="kind"><span class="ico">👁</span>Start here</span>
    <h1>What changed for users</h1>
    ${bs.length ? `<p class="lead">grasp ran each example on the old code and the new code. Before each result, guess what the new code does.</p>
    ${bs.map(b => behaviorHTML(b, { click: true, predict: true, lines: 5 })).join("")}
    ${bs.some(b => !shownNow(b)) ? `<button class="link" id="showAll">Skip guessing, show all</button>` : ""}`
    : `<div class="note info">The agent didn't demonstrate any change, so there are no before/after examples.</div>`}
    ${(() => { if (!String(S.agent).startsWith("git+")) return ""; const says = S.events.filter(e => e.kind === "say"); if (!says.length) return "";
        const paras = says[says.length - 1].text.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean); const tip = paras[paras.length - 1];
        return `<h2 class="sec">Where to look first</h2><div class="risk" style="border-left-color:var(--accent)"><div>${esc(tip).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")}</div><div style="color:var(--mute);font-size:13px;margin-top:6px">Suggested by Claude after reading the whole change.</div></div>`; })()}
    <h2 class="sec">What it could break</h2>
    <p class="lead" style="font-size:16px">grasp checked the project itself. The agent didn't write this part.</p>
    ${riskHTML()}
    <div class="actions"><button class="big ok" id="start" style="background:var(--accent)">Review the decisions →</button></div></div>`;
  $("#start").onclick = () => move(1);
  document.querySelectorAll("[data-go]").forEach(el => el.onclick = () => { const i = items.findIndex(d => d.id === el.dataset.go); if (i >= 0) { idx = i; open = ""; render(); } });
  document.querySelectorAll("[data-reveal]").forEach(el => el.onclick = () => { revealed.add(el.dataset.reveal); renderOverview(); });
  document.querySelectorAll("[data-exp]").forEach(el => el.onclick = () => answer(el.dataset.exp, el.dataset.v === "1"));
  document.querySelectorAll("[data-testdiff]").forEach(el => el.onclick = () => { const k = "t:" + el.dataset.testdiff; open = open === k ? "" : k; renderOverview(); });
  if ($("#showAll")) $("#showAll").onclick = () => { S.behaviors.forEach(b => revealed.add(b.id)); renderOverview(); };
}

function renderCard(d) {
  const k = KINDS[d.kind] || KINDS.other, v = verdict(d.id), rv = R[d.id] || {};
  const edits = (d.edits || []).map(s => S.events[s - 1]);
  const why = d.unexplained ? "The agent changed these files without saying why. Look at the code, or ask the agent." : firstSentence(d.why);
  const notes = [];
  if ((d.unverified || []).length) notes.push(`<div class="note warn">⚠ It said it would change <b>${esc(d.unverified.join(", "))}</b>, but never did.</div>`);
  if (surprised(d)) notes.push(`<div class="note warn">😮 One of its examples surprised you. Read the full reasoning before you approve.</div>`);
  for (const t of I.tests.filter(t => (t.decisions || []).includes(d.id))) notes.push(`<div class="note warn">🧪 It changed an existing test, <b>${esc(t.file)}</b>${t.removed_checks ? `, and removed ${t.removed_checks} check${t.removed_checks > 1 ? "s" : ""}` : ""}. Check it wasn't weakened to pass.</div>`);
  for (const r of I.ripples.filter(r => r.decision === d.id && !r.added_only)) notes.push(`<div class="note warn">🔗 <b>${esc(r.symbol)}</b> ${r.removed ? "was deleted but is still used" : "is also used"} in ${r.uses.length} place${r.uses.length > 1 ? "s" : ""} the agent didn't touch: ${r.uses.slice(0, 3).map(u => `<code>${esc(u.file)}:${u.line}</code>`).join(", ")}${r.uses.length > 3 ? "…" : ""}</div>`);
  if (d.inferred) notes.push(`<div class="note info">The agent didn't explain this step, so grasp grouped these edits using what it said.</div>`);
  const hasMore = !d.unexplained && ((d.why && d.why.length > why.length) || (d.alternatives || []).length || d.risk);
  $("#main").innerHTML = `<div class="card in">
    <span class="kind"><span class="ico">${k[0]}</span>${d.unexplained ? "Needs a look" : esc(k[1])} · ${items.slice(0, idx + 1).filter(x => !x.overview).length} of ${items.filter(x => !x.overview).length}</span>
    ${v ? `<span class="status ${v}">${v === "approved" ? "✓ Approved" : "✗ Rejected"}</span>` : ""}
    <h1>${esc(short(d.title))}</h1>
    <p class="why">${esc(why)}</p>
    ${notes.join("")}
    ${d.unexplained ? "" : (() => { const bs = S.behaviors.filter(b => b.decision_id === d.id);
        return bs.length ? bs.map(b => behaviorHTML(b)).join("") : `<div class="note info">Not shown: the agent didn't demonstrate this change, so you only have its description and the code.</div>`; })()}
    ${mapSVG(d)}
    ${d.unexplained ? `<div class="actions"><button class="big ghost" id="next">Next →</button></div>` : `
    <div class="actions">
      <button class="big ok" id="ok">✓ Approve</button>
      <button class="big bad" id="no">✗ Reject</button>
      <button class="big ghost" id="skip" title="Decide later">Skip</button>
    </div>
    <div id="rejectBox"></div>`}
    <div class="more">
      ${edits.length ? `<button class="link" data-open="code">${open === "code" ? "Hide" : "See"} the code (${edits.length} change${edits.length > 1 ? "s" : ""})</button>` : ""}
      ${hasMore ? `<button class="link" data-open="why">${open === "why" ? "Hide" : "Full"} reasoning</button>` : ""}
      ${(rv.comments || []).length ? `<button class="link" data-open="notes">${rv.comments.length} comment${rv.comments.length > 1 ? "s" : ""}</button>` : ""}
    </div>
    ${open === "code" ? `<div class="box">${edits.map(diffHTML).join("")}</div>` : ""}
    ${open === "why" ? `<div class="box">
       ${d.why ? `<h4>Why</h4><div>${esc(d.why)}</div>` : ""}
       ${(d.alternatives || []).length ? `<h4>It considered instead</h4><ul>${d.alternatives.map(a => `<li>${esc(a)}</li>`).join("")}</ul>` : ""}
       ${d.risk ? `<h4>Risk it saw</h4><div>${esc(d.risk)}</div>` : ""}</div>` : ""}
    ${open === "notes" ? `<div class="box">${(rv.comments || []).map(c => `<div class="comment"><div class="who">${esc(c.author)} · ${new Date(c.time).toLocaleString()}</div>${esc(c.text)}</div>`).join("")}</div>` : ""}
  </div>`;
  document.querySelectorAll("[data-open]").forEach(b => b.onclick = () => { open = open === b.dataset.open ? "" : b.dataset.open; renderCard(d); });
  if ($("#next")) $("#next").onclick = () => move(1);
  if ($("#ok")) { $("#ok").onclick = () => decide(d, "approved", ""); $("#no").onclick = () => askReject(d); $("#skip").onclick = () => move(1); }
}

function askReject(d) {
  $("#rejectBox").innerHTML = `<div class="ask-reject"><p>What should change? The agent will read this.</p>
    <textarea id="why" placeholder="e.g. Use the shared rate limiter in pkg/ratelimit instead"></textarea>
    <div class="row"><button class="btn primary" id="send">Reject and send</button><button class="btn" id="cancel">Cancel</button>
    <span style="margin-left:auto;color:var(--mute);font-size:14px">your name</span><input class="name" id="who" value="${esc(me)}" placeholder="reviewer"></div></div>`;
  $("#why").focus();
  $("#send").onclick = () => decide(d, "rejected", $("#why").value);
  $("#cancel").onclick = () => { $("#rejectBox").innerHTML = ""; };
}

async function answer(id, ok) {
  const res = await fetch("api/review", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ decision: id, author: me || "reviewer", expected: ok }) });
  if (res.ok) { R[id] = await res.json(); renderOverview(); }
}

async function decide(d, v, comment) {
  const who = $("#who"); if (who) { me = who.value.trim(); try { localStorage.setItem("grasp.name", me); } catch {} }
  const res = await fetch("api/review", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ decision: d.id, author: me || "reviewer", verdict: v, comment }) });
  if (!res.ok) return;
  R[d.id] = await res.json();
  renderStrip(d.id);
  setTimeout(() => { open = ""; idx = nextPending(idx); render(); }, 450);
}

function nextPending(from) {
  for (let i = from + 1; i < items.length; i++) if (reviewable(items[i]) && !verdict(items[i].id)) return i;
  for (let i = 0; i < items.length; i++) if (reviewable(items[i]) && !verdict(items[i].id)) return i;
  return items.length;
}
function move(step) { open = ""; idx = Math.max(0, Math.min(items.length, idx + step)); render(); }

async function renderDone() {
  const rev = items.filter(reviewable), a = rev.filter(d => verdict(d.id) === "approved").length, r = rev.filter(d => verdict(d.id) === "rejected").length;
  const fb = r || rev.some(d => (R[d.id]?.comments || []).length) ? await (await fetch("api/feedback")).text() : "";
  $("#main").innerHTML = `<div class="card done in">
    <div class="big-ico">${r ? "📝" : "🎉"}</div>
    <h1>All decisions reviewed</h1>
    <div class="tally"><div><b style="color:var(--ok)">${a}</b>approved</div><div><b style="color:var(--bad)">${r}</b>rejected</div></div>
    ${S.behaviors.some(b => expected(b.id) === false) ? `<p>😮 ${S.behaviors.filter(b => expected(b.id) === false).length} example${S.behaviors.filter(b => expected(b.id) === false).length > 1 ? "s" : ""} surprised you. Worth a second look.</p>` : ""}
    <p>${r ? "Next time the agent starts, it reads your feedback and fixes what you rejected." : "Nothing to fix. The agent's work matches what you wanted."}</p>
    ${fb ? `<details><summary style="cursor:pointer;color:var(--mute)">What the agent will read</summary><pre class="fb">${esc(fb)}</pre></details>` : ""}
    <div class="row" style="justify-content:center;margin-top:18px"><button class="btn" id="again">Look again from the start</button></div></div>`;
  $("#again").onclick = () => { idx = 0; render(); };
}

// Watch: the session as a reel, one animated scene per step.
function steps() { return S.events.filter(e => !["read", "tool"].includes(e.kind)); }
function who() { return S.agent === "claude-code" ? "Claude" : String(S.agent).startsWith("git") ? "The change" : "The agent"; }
function clip(s, n) { s = String(s || "").replace(/\s+/g, " "); return s.length > n ? s.slice(0, n - 1) + "…" : s; }
// seconds a step stays on screen at 1x: enough to read what it shows
function seconds(e) {
  const len = String(e.text || "").length;
  switch (e.kind) {
    case "prompt": return Math.min(7, 4 + len / 80);
    case "say": return Math.min(7, 3.5 + len / 90);
    case "decision": return 5.5;
    case "behavior": return 7;
    case "edit": return 4.5;
    case "command": return 4;
    default: return 3;
  }
}
const BEATS = { prompt: "You asked", say: "", decision: "Decision", edit: "File change", command: "Command", behavior: "Before → after", feedback: "Feedback" };

function scene(e) {
  const w = who();
  switch (e.kind) {
    case "prompt": return `<div class="sc chat"><div class="av">🧑</div><div class="bubble me" data-type="${esc(clip(e.text, 240))}"></div></div><div class="cap">You asked</div>`;
    case "say": return `<div class="sc chat"><div class="av">🤖</div><div class="bubble ai up">${esc(clip(e.text, 260))}</div></div><div class="cap">${w} said</div>`;
    case "feedback": return `<div class="sc"><div class="drop">📥</div></div><div class="cap">${w} checked your review feedback</div>`;
    case "decision": {
      const d = S.decisions.find(d => d.id === e.decision_id) || { title: e.text, kind: "other" }, k = KINDS[d.kind] || KINDS.other;
      return `<div class="sc"><div class="flip"><div class="big-ico">${k[0]}</div><div class="klabel">${esc(k[1])}</div><div class="dtitle">${esc(short(d.title))}</div>
        <div class="dwhy later">${esc(firstSentence(d.why || ""))}</div></div></div><div class="cap">${w} decided</div>`;
    }
    case "edit": {
      const c = counts(e), ch = ops(e).filter(([k]) => k !== " ").slice(0, 7);
      return `<div class="sc"><div class="file pop1">📄 <code>${esc(e.file)}</code>${e.new_file ? ' <span class="newb">new</span>' : ""}</div>
        <div class="tally2"><span class="add" data-count="${c.add}">+0</span><span class="del" data-count="${c.del}">−0</span></div>
        <div class="code">${ch.map(([k, l], i) => `<div class="cl ${k === "+" ? "in" : "out"}" style="animation-delay:${(0.6 + i * 0.25).toFixed(2)}s">${k} ${esc(clip(l, 70)) || "&nbsp;"}</div>`).join("")}
        ${ops(e).filter(([k]) => k !== " ").length > 7 ? `<div class="cl more" style="animation-delay:${(0.6 + 7 * 0.25).toFixed(2)}s">… more changes</div>` : ""}</div></div>
        <div class="cap">${w} ${e.new_file ? "created a file" : "changed a file"}</div>`;
    }
    case "command": return `<div class="sc"><div class="term"><div class="tbar"><i></i><i></i><i></i></div><div class="tline">$ <span data-type="${esc(clip(e.text, 120))}"></span></div>
        <div class="tres later ${e.failed ? "fail" : "ok"}">${e.failed ? "✗ failed" : "✓ done"}</div></div></div><div class="cap">${w} ran a command</div>`;
    case "behavior": {
      const b = S.behaviors.find(b => b.seq === e.seq) || { before: {}, after: {} };
      const f = r => r.skipped ? "(didn't exist yet)" : firstLines(String(r.output || "").replace(/\r/g, ""), 4);
      return `<div class="sc"><div class="btitle">🔬 ${esc(clip(e.text, 80))}</div><div class="bpair">
        <div class="bside before up"><div class="lbl">Before</div><pre>${esc(f(b.before || {}))}</pre></div>
        <div class="barrow">→</div>
        <div class="bside after slide"><div class="lbl">Now</div><pre>${esc(f(b.after || {}))}</pre></div></div></div><div class="cap">grasp ran it on the old and the new code</div>`;
    }
    default: return `<div class="sc"><div class="cap">${esc(e.tool || e.kind)}</div></div>`;
  }
}

function renderWatch() {
  const st = steps();
  if (!st.length) { $("#main").innerHTML = `<div class="card empty">Nothing to watch yet.</div>`; return; }
  const p = Math.min(watch.pos, st.length - 1), e = st[p], dur = seconds(e) / watch.speed;
  const many = st.length > 40;
  $("#main").innerHTML = `<div class="reel ${watch.timer ? "" : "paused"}" style="--d:${dur}s">
    <div class="bars">${many ? `<i><b style="width:${(p / st.length * 100).toFixed(1)}%"></b></i>`
      : st.map((_, i) => `<i><b class="${i < p ? "full" : i === p ? "run" : ""}"></b></i>`).join("")}</div>
    <div class="beat">${esc(BEATS[e.kind] || "")}</div>
    <div class="stage" id="stage">${scene(e)}</div>
    <div class="tap left" id="tapL" title="Back"></div><div class="tap right" id="tapR" title="Next"></div>
  </div>
  <div class="controls"><button class="btn" id="prev" title="Back">⏮</button><button class="btn primary" id="pp">${watch.timer ? "❚❚ Pause" : "▶ Play"}</button><button class="btn" id="nx" title="Next">⏭</button>
    <select id="spd" aria-label="Speed">${[0.5, 1, 1.5].map(v => `<option value="${v}" ${v === watch.speed ? "selected" : ""}>${v}×</option>`).join("")}</select>
    <span class="step">step ${p + 1} of ${st.length}</span></div>`;
  const decId = e.decision_id || (e.kind === "edit" && S.unexplained.includes(e.seq) ? UNEXPLAINED : "");
  if (decId) renderStrip(decId);
  animateScene(dur);
  $("#pp").onclick = togglePlay;
  $("#prev").onclick = $("#tapL").onclick = () => go2(p - 1);
  $("#nx").onclick = $("#tapR").onclick = () => go2(p + 1);
  $("#spd").onchange = ev => { watch.speed = +ev.target.value; if (watch.timer) { stopPlay(); togglePlay(); } else renderWatch(); };
}

// typewriter text and count-up numbers, timed to the step length
function animateScene(dur) {
  clearInterval(watch.anim);
  const typers = [...document.querySelectorAll("#stage [data-type]")];
  const counters = [...document.querySelectorAll("#stage [data-count]")];
  const t0 = performance.now(), typeFor = Math.min(dur * 0.55, 3.2) * 1000;
  const tick = () => {
    const t = performance.now() - t0;
    for (const el of typers) { const full = el.dataset.type, n = Math.ceil(full.length * Math.min(1, t / typeFor)); el.textContent = full.slice(0, n); el.classList.toggle("caret", n < full.length); }
    for (const el of counters) { const n = Math.round(+el.dataset.count * Math.min(1, t / 1200)); el.textContent = (el.classList.contains("add") ? "+" : "−") + n; }
    if (t > Math.max(typeFor, 1200)) clearInterval(watch.anim);
  };
  tick();
  watch.anim = setInterval(tick, 30);
}

function go2(p) {
  const n = steps().length;
  watch.pos = Math.max(0, Math.min(n - 1, p));
  if (watch.timer) { stopPlay(); togglePlay(); } else renderWatch();
}
function stopPlay() { clearTimeout(watch.timer); watch.timer = null; }
function togglePlay() {
  if (watch.timer) { stopPlay(); return renderWatch(); }
  const st = steps();
  if (watch.pos >= st.length - 1 && watch.ended) watch.pos = 0;
  watch.ended = false;
  const next = () => {
    const e = steps()[watch.pos];
    watch.timer = setTimeout(() => {
      if (watch.pos >= steps().length - 1) { watch.ended = true; stopPlay(); renderWatch(); return; }
      watch.pos++; next(); renderWatch();
    }, seconds(e) / watch.speed * 1000);
  };
  next();
  renderWatch();
}

function setTab() { document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.tab === tab)); }
document.querySelectorAll(".tab").forEach(t => t.onclick = () => { tab = t.dataset.tab; stopPlay(); setTab(); render(); if (tab === "watch" && watch.pos === 0) togglePlay(); });
$("#sessions").onchange = e => { sessionId = e.target.value; stopPlay(); load(); };
document.addEventListener("keydown", e => {
  if (S && tab === "watch" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) {
    if (e.key === " ") { e.preventDefault(); togglePlay(); }
    else if (e.key === "ArrowRight") go2(watch.pos + 1);
    else if (e.key === "ArrowLeft") go2(watch.pos - 1);
    return;
  }
  if (!S || tab !== "review" || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  const d = items[idx];
  if (e.key === "ArrowRight") move(1);
  else if (e.key === "ArrowLeft") move(-1);
  else if (e.key === "a" && d && reviewable(d)) decide(d, "approved", "");
  else if (e.key === "r" && d && reviewable(d)) { e.preventDefault(); askReject(d); }
});
load().then(() => {
  try { const es = new EventSource("api/live"); let first = true;
    es.onmessage = () => { if (first) { first = false; return; } if (!watch.timer && !$("#rejectBox")?.innerHTML) load(true); }; } catch {}
});
</script>
</body>
