<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>grasp review</title>
<style>
:root{
  --bg:#f5f6f8;--card:#fff;--ink:#15171c;--mute:#646b77;--line:#e0e4ea;--soft:#eef1f5;
  --accent:#3b5bdb;--ok:#2b8a3e;--okbg:#e7f5ea;--bad:#c92a2a;--badbg:#fdeded;--warn:#b35c00;--warnbg:#fff4e2;
  --add:#e7f5ea;--addink:#1e6b30;--del:#fdeded;--delink:#a61e1e;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115;--card:#181b21;--ink:#e9ebef;--mute:#9aa2ae;--line:#2a2f38;--soft:#21252d;
  --accent:#7d95ff;--ok:#69db7c;--okbg:#15291a;--bad:#ff8787;--badbg:#351a1a;--warn:#ffa94d;--warnbg:#33250f;
  --add:#15291a;--addink:#8ce99a;--del:#351a1a;--delink:#ffa8a8;
}}
:root[data-theme="dark"]{
  --bg:#0f1115;--card:#181b21;--ink:#e9ebef;--mute:#9aa2ae;--line:#2a2f38;--soft:#21252d;
  --accent:#7d95ff;--ok:#69db7c;--okbg:#15291a;--bad:#ff8787;--badbg:#351a1a;--warn:#ffa94d;--warnbg:#33250f;
  --add:#15291a;--addink:#8ce99a;--del:#351a1a;--delink:#ffa8a8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 48px}
header{display:flex;align-items:center;gap:12px;padding:14px 0}
.logo{font-weight:750;font-size:20px;letter-spacing:-.02em}
select{margin-left:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;max-width:260px;font-size:14px}
.tabs{display:flex;gap:6px;background:var(--soft);padding:4px;border-radius:12px;width:max-content;margin:4px 0 18px}
.tab{border:0;background:none;padding:7px 18px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--mute)}
.tab.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.ask{display:flex;gap:10px;align-items:baseline;color:var(--mute);margin-bottom:14px}
.ask span{white-space:nowrap}
.ask b{color:var(--ink);font-weight:600;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:20px}
.dot{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;font-weight:700;cursor:pointer;transition:transform .2s,background .3s,border-color .3s;font-size:15px}
.dot:hover{transform:scale(1.08)}
.dot.on{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 20%,transparent)}
.dot.approved{background:var(--ok);border-color:var(--ok);color:#fff}
.dot.rejected{background:var(--bad);border-color:var(--bad);color:#fff}
.dot.warn{border-color:var(--warn);color:var(--warn);border-style:dashed}
.dot.lit{animation:lit .9s ease-out}
@keyframes lit{0%{transform:scale(1.35)}100%{transform:scale(1)}}
.progress{margin-left:auto;font-size:14px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.in{animation:in .35s ease-out}
@keyframes in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.kind{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--mute)}
.kind .ico{font-size:20px}
h1{font-size:28px;line-height:1.25;margin:10px 0 10px;letter-spacing:-.01em}
.why{font-size:18px;color:var(--mute);margin:0 0 6px}
.status{display:inline-block;border-radius:999px;padding:3px 12px;font-size:14px;font-weight:600;margin-left:8px}
.status.approved{background:var(--okbg);color:var(--ok)}.status.rejected{background:var(--badbg);color:var(--bad)}
svg.map{width:100%;height:auto;display:block;margin:18px 0 6px}
.map text{fill:var(--ink);font-size:14px}.map .sub{fill:var(--mute);font-size:12px}
.arrow{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-dasharray:400;stroke-dashoffset:400;animation:draw .7s ease-out forwards}
.arrow.claim{stroke:var(--warn);stroke-dasharray:6 6;animation:none;stroke-dashoffset:0}
@keyframes draw{to{stroke-dashoffset:0}}
.pop{opacity:0;animation:pop .4s ease-out forwards}
@keyframes pop{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.note{border-radius:12px;padding:10px 14px;margin:10px 0;font-size:15px}
.note.warn{background:var(--warnbg);color:var(--warn)}
.note.info{background:var(--soft);color:var(--mute)}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.big{flex:1;min-width:150px;border:0;border-radius:14px;padding:16px;font-size:18px;font-weight:700;cursor:pointer;transition:transform .1s}
.big:active{transform:scale(.98)}
.big.ok{background:var(--ok);color:#fff}.big.bad{background:var(--bad);color:#fff}
.big.ghost{background:var(--soft);color:var(--ink);flex:0 0 auto;min-width:0;font-size:15px;padding:16px 18px}
.more{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.link{border:1px solid var(--line);background:none;border-radius:10px;padding:8px 14px;cursor:pointer;font-size:14px;color:var(--mute)}
.link:hover{color:var(--ink);border-color:var(--accent)}
.box{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.box h4{margin:12px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
.box ul{margin:0;padding-left:20px}
.diff{border:1px solid var(--line);border-radius:10px;margin:10px 0;overflow:hidden}
.diff .hd{padding:6px 12px;background:var(--soft);font:13px ui-monospace,Menlo,monospace}
.diff pre{margin:0;padding:6px 0;font:12.5px/1.5 ui-monospace,Menlo,monospace;overflow:auto;max-height:300px}
.diff .l{display:block;padding:0 12px;white-space:pre}.diff .gap{color:var(--mute);background:var(--soft);font-style:italic}.diff .a{background:var(--add);color:var(--addink)}.diff .d{background:var(--del);color:var(--delink)}
textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:12px;background:var(--soft);padding:10px 12px;resize:vertical;font-size:16px}
.ask-reject{margin-top:16px}
.ask-reject p{margin:0 0 8px;font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 16px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
input.name{border:1px solid var(--line);border-radius:10px;background:var(--soft);padding:7px 10px;width:150px}
.comment{background:var(--soft);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:15px}.comment .who{font-size:12px;color:var(--mute)}
.done{text-align:center;padding:40px 28px}
.done .big-ico{font-size:56px}
.done h1{margin:8px 0}
.done p{color:var(--mute);font-size:18px}
.tally{display:flex;justify-content:center;gap:28px;margin:20px 0;font-size:16px}
.tally b{display:block;font-size:34px}
pre.fb{text-align:left;white-space:pre-wrap;background:var(--soft);padding:14px;border-radius:12px;font-size:13px;max-height:300px;overflow:auto}
.player{min-height:320px;display:flex;flex-direction:column;justify-content:center}
.past{color:var(--mute);opacity:.55;font-size:15px;margin:4px 0;display:flex;gap:10px}
.now{display:flex;gap:16px;align-items:flex-start;margin:18px 0}
.now .ico{font-size:40px;line-height:1}
.now .txt{font-size:24px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.now .txt small{display:block;font-size:15px;font-weight:400;color:var(--mute);margin-top:6px}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-top:18px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.controls{display:flex;gap:10px;align-items:center;margin-top:16px}
.controls .step{margin-left:auto;color:var(--mute);font-size:14px}
code{font:0.9em ui-monospace,Menlo,monospace;background:var(--soft);padding:1px 6px;border-radius:6px}
.empty{text-align:center;color:var(--mute);padding:60px 20px}
.keys{margin-top:14px;font-size:13px;color:var(--mute);text-align:center}
.k{font:12px ui-monospace,Menlo,monospace;background:var(--soft);border:1px solid var(--line);border-radius:5px;padding:0 6px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">grasp</div>
    <select id="sessions" aria-label="Session"></select>
  </header>
  <div class="tabs"><button class="tab on" data-tab="review">Review</button><button class="tab" data-tab="watch">Watch</button></div>
  <div class="ask" id="ask"></div>
  <div class="strip" id="strip"></div>
  <div id="main"></div>
  <div class="keys" id="keys">Keys: <span class="k">←</span> <span class="k">→</span> move · <span class="k">a</span> approve · <span class="k">r</span> reject</div>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KINDS = {architecture:["🏛","Architecture"],"data-model":["🗃","Data model"],api:["🔌","API"],"business-rule":["📏","Business rule"],
  dependency:["📦","New dependency"],security:["🔒","Security"],performance:["⚡","Performance"],testing:["🧪","Tests"],quality:["✨","Code quality"],other:["•","Change"]};
const UNEXPLAINED = "__unexplained__";
let S = null, R = {}, items = [], idx = 0, tab = "review", sessionId = "", open = "";
let watch = { pos: 0, timer: null };
let me = ""; try { me = localStorage.getItem("grasp.name") || ""; } catch {}

// Short headline: the first clause of what the agent wrote.
function short(t) {
  t = String(t || "").replace(/\s+/g, " ").trim();
  for (const sep of [": ", "; ", " (", " — ", " - ", ", "]) { const i = t.indexOf(sep); if (i > 14) { t = t.slice(0, i); break; } }
  return t.length > 64 ? t.slice(0, 62).replace(/\s\S*$/, "") + "…" : t;
}
function firstSentence(t) {
  t = String(t || "").replace(/\s+/g, " ").trim();
  const m = t.match(/^(.{20,}?[.!?])\s/); t = m ? m[1] : t;
  return t.length > 170 ? t.slice(0, 168).replace(/\s\S*$/, "") + "…" : t;
}
const lines = s => s ? String(s).split("\n").length : 0;
const verdict = id => (R[id] && R[id].verdict) || "";

async function load(keep) {
  const list = await (await fetch("api/sessions")).json();
  if (!list.length) { $("#main").innerHTML = `<div class="card empty">No sessions yet.<br><br>Run <code>grasp init</code> and work with Claude Code here,<br>or <code>grasp import --latest</code>.</div>`; return; }
  if (!sessionId || !list.some(s => s.id === sessionId)) sessionId = list[0].id;
  $("#sessions").innerHTML = list.map(s => `<option value="${esc(s.id)}" ${s.id === sessionId ? "selected" : ""}>${esc(short(s.title || s.id))}</option>`).join("");
  const res = await (await fetch("api/session?id=" + encodeURIComponent(sessionId))).json();
  S = res.session; R = res.reviews || {};
  S.events = S.events || []; S.decisions = S.decisions || []; S.unexplained = S.unexplained || [];
  items = S.decisions.slice().sort((a, b) => a.seq - b.seq);
  if (S.unexplained.length) items.push({ id: UNEXPLAINED, kind: "other", title: "Changes with no reason given", edits: S.unexplained,
    files: [...new Set(S.unexplained.map(s => S.events[s - 1].file))], unexplained: true, seq: Math.min(...S.unexplained) });
  if (!keep) { idx = firstPending(); watch.pos = 0; }
  idx = Math.min(idx, items.length);
  render();
}

function firstPending() { const i = items.findIndex(d => !d.unexplained && !verdict(d.id)); return i < 0 ? items.length : i; }

function render() {
  const prompt = S.events.find(e => e.kind === "prompt");
  $("#ask").innerHTML = prompt ? `<span>You asked</span><b title="${esc(prompt.text)}">${esc(prompt.text)}</b>` : "";
  renderStrip();
  $("#keys").style.display = tab === "review" ? "" : "none";
  if (tab === "watch") return renderWatch();
  if (idx >= items.length) return renderDone();
  renderCard(items[idx]);
}

function renderStrip(lit) {
  const reviewable = items.filter(d => !d.unexplained);
  const done = reviewable.filter(d => verdict(d.id)).length;
  $("#strip").innerHTML = items.map((d, i) => {
    const v = d.unexplained ? "warn" : verdict(d.id);
    const label = d.unexplained ? "?" : (v === "approved" ? "✓" : v === "rejected" ? "✗" : i + 1);
    return `<button class="dot ${v} ${tab === "review" && i === idx ? "on" : ""} ${lit === d.id ? "lit" : ""}" data-i="${i}" title="${esc(short(d.title))}">${label}</button>`;
  }).join("") + `<span class="progress">${done} of ${reviewable.length} reviewed</span>`;
  document.querySelectorAll(".dot").forEach(b => b.onclick = () => { tab = "review"; setTab(); stopPlay(); idx = +b.dataset.i; open = ""; render(); });
}

function mapSVG(d) {
  const edits = (d.edits || []).map(s => S.events[s - 1]);
  const per = {};
  for (const e of edits) { const p = per[e.file] = per[e.file] || { add: 0, del: 0, isNew: false }, c = counts(e); p.add += c.add; p.del += c.del; p.isNew = p.isNew || e.new_file; }
  const files = Object.keys(per).map(f => ({ f, ...per[f] })).concat((d.unverified || []).filter(f => !per[f]).map(f => ({ f, claim: true })));
  if (!files.length) return "";
  const rowH = 46, H = Math.max(files.length * rowH, 70), W = 720, k = KINDS[d.kind] || KINDS.other;
  let s = `<svg class="map" viewBox="0 0 ${W} ${H}" role="img" aria-label="Files this decision changed">`;
  s += `<rect x="0" y="${H/2-28}" width="190" height="56" rx="14" fill="var(--soft)" stroke="${d.unexplained ? "var(--warn)" : "var(--accent)"}" stroke-width="2"/>
        <text x="20" y="${H/2+7}" style="font-size:22px">${k[0]}</text><text x="52" y="${H/2+5}" style="font-weight:600">${d.unexplained ? "No reason" : esc(k[1])}</text>`;
  files.forEach((x, i) => {
    const y = rowH * i + rowH / 2 + (H - files.length * rowH) / 2, delay = (i * 0.12).toFixed(2);
    s += `<path class="arrow ${x.claim ? "claim" : ""}" style="animation-delay:${delay}s" d="M190,${H/2} C300,${H/2} 330,${y} 420,${y}"/>`;
    const name = x.f.length > 30 ? "…" + x.f.slice(-29) : x.f;
    const sub = x.claim ? "named, but never changed" : x.isNew ? `new file · ${x.add} lines` : `+${x.add}  −${x.del} lines`;
    s += `<g class="pop" style="animation-delay:${(0.25 + i * 0.12).toFixed(2)}s"><rect x="420" y="${y-19}" width="300" height="38" rx="10" fill="var(--card)" stroke="${x.claim ? "var(--warn)" : "var(--line)"}" ${x.claim ? 'stroke-dasharray="5 4"' : ""}/>
      <text x="436" y="${y-1}" style="font-family:ui-monospace,Menlo,monospace;font-size:13px">${esc(name)}</text><text class="sub" x="436" y="${y+13}">${sub}</text></g>`;
  });
  return s + "</svg>";
}

// diffOps compares two texts line by line (longest common subsequence) and
// returns [kind, line] pairs: " " unchanged, "-" removed, "+" added.
function diffOps(a, b) {
  a = a ? String(a).split("\n") : []; b = b ? String(b).split("\n") : [];
  if (a.length * b.length > 4e6) return a.map(l => ["-", l]).concat(b.map(l => ["+", l]));
  const n = a.length, m = b.length, t = Array.from({ length: n + 1 }, () => new Uint32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) t[i][j] = a[i] === b[j] ? t[i + 1][j + 1] + 1 : Math.max(t[i + 1][j], t[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < n && j < m) { if (a[i] === b[j]) { out.push([" ", a[i]]); i++; j++; } else if (t[i + 1][j] >= t[i][j + 1]) out.push(["-", a[i++]]); else out.push(["+", b[j++]]); }
  while (i < n) out.push(["-", a[i++]]); while (j < m) out.push(["+", b[j++]]);
  return out;
}
const opsCache = new Map();
function ops(e) { if (!opsCache.has(e)) opsCache.set(e, diffOps(e.new_file ? "" : e.before, e.after)); return opsCache.get(e); }
function counts(e) { let add = 0, del = 0; for (const [k] of ops(e)) { if (k === "+") add++; else if (k === "-") del++; } return { add, del }; }

function diffHTML(e) {
  // show changed lines with 2 lines of context, collapsing long unchanged runs
  const o = ops(e), keep = o.map(() => false);
  o.forEach(([k], i) => { if (k !== " ") for (let j = Math.max(0, i - 2); j <= Math.min(o.length - 1, i + 2); j++) keep[j] = true; });
  let html = "", skipped = 0, shown = 0;
  o.forEach(([k, l], i) => {
    if (!keep[i]) { skipped++; return; }
    if (skipped) { html += `<span class="l gap">⋯ ${skipped} unchanged line${skipped > 1 ? "s" : ""}</span>`; skipped = 0; }
    if (shown++ > 200) return;
    html += `<span class="l ${k === "+" ? "a" : k === "-" ? "d" : ""}">${k === " " ? " " : k} ${esc(l)}</span>`;
  });
  if (skipped) html += `<span class="l gap">⋯ ${skipped} unchanged line${skipped > 1 ? "s" : ""}</span>`;
  const c = counts(e);
  return `<div class="diff"><div class="hd">${esc(e.file)} · ${e.new_file ? "new file" : `+${c.add} −${c.del}`}</div><pre>${html}</pre></div>`;
}

function renderCard(d) {
  const k = KINDS[d.kind] || KINDS.other, v = verdict(d.id), rv = R[d.id] || {};
  const edits = (d.edits || []).map(s => S.events[s - 1]);
  const why = d.unexplained ? "The agent changed these files without saying why. Look at the code, or ask the agent." : firstSentence(d.why);
  const notes = [];
  if ((d.unverified || []).length) notes.push(`<div class="note warn">⚠ It said it would change <b>${esc(d.unverified.join(", "))}</b>, but never did.</div>`);
  if (d.inferred) notes.push(`<div class="note info">The agent didn't explain this step, so grasp grouped these edits using what it said.</div>`);
  const hasMore = !d.unexplained && ((d.why && d.why.length > why.length) || (d.alternatives || []).length || d.risk);
  $("#main").innerHTML = `<div class="card in">
    <span class="kind"><span class="ico">${k[0]}</span>${d.unexplained ? "Needs a look" : esc(k[1])} · ${idx + 1} of ${items.length}</span>
    ${v ? `<span class="status ${v}">${v === "approved" ? "✓ Approved" : "✗ Rejected"}</span>` : ""}
    <h1>${esc(short(d.title))}</h1>
    <p class="why">${esc(why)}</p>
    ${notes.join("")}
    ${mapSVG(d)}
    ${d.unexplained ? `<div class="actions"><button class="big ghost" id="next">Next →</button></div>` : `
    <div class="actions">
      <button class="big ok" id="ok">✓ Approve</button>
      <button class="big bad" id="no">✗ Reject</button>
      <button class="big ghost" id="skip" title="Decide later">Skip</button>
    </div>
    <div id="rejectBox"></div>`}
    <div class="more">
      ${edits.length ? `<button class="link" data-open="code">${open === "code" ? "Hide" : "See"} the code (${edits.length} change${edits.length > 1 ? "s" : ""})</button>` : ""}
      ${hasMore ? `<button class="link" data-open="why">${open === "why" ? "Hide" : "Full"} reasoning</button>` : ""}
      ${(rv.comments || []).length ? `<button class="link" data-open="notes">${rv.comments.length} comment${rv.comments.length > 1 ? "s" : ""}</button>` : ""}
    </div>
    ${open === "code" ? `<div class="box">${edits.map(diffHTML).join("")}</div>` : ""}
    ${open === "why" ? `<div class="box">
       ${d.why ? `<h4>Why</h4><div>${esc(d.why)}</div>` : ""}
       ${(d.alternatives || []).length ? `<h4>It considered instead</h4><ul>${d.alternatives.map(a => `<li>${esc(a)}</li>`).join("")}</ul>` : ""}
       ${d.risk ? `<h4>Risk it saw</h4><div>${esc(d.risk)}</div>` : ""}</div>` : ""}
    ${open === "notes" ? `<div class="box">${(rv.comments || []).map(c => `<div class="comment"><div class="who">${esc(c.author)} · ${new Date(c.time).toLocaleString()}</div>${esc(c.text)}</div>`).join("")}</div>` : ""}
  </div>`;
  document.querySelectorAll("[data-open]").forEach(b => b.onclick = () => { open = open === b.dataset.open ? "" : b.dataset.open; renderCard(d); });
  if ($("#next")) $("#next").onclick = () => move(1);
  if ($("#ok")) { $("#ok").onclick = () => decide(d, "approved", ""); $("#no").onclick = () => askReject(d); $("#skip").onclick = () => move(1); }
}

function askReject(d) {
  $("#rejectBox").innerHTML = `<div class="ask-reject"><p>What should change? The agent will read this.</p>
    <textarea id="why" placeholder="e.g. Use the shared rate limiter in pkg/ratelimit instead"></textarea>
    <div class="row"><button class="btn primary" id="send">Reject and send</button><button class="btn" id="cancel">Cancel</button>
    <span style="margin-left:auto;color:var(--mute);font-size:14px">your name</span><input class="name" id="who" value="${esc(me)}" placeholder="reviewer"></div></div>`;
  $("#why").focus();
  $("#send").onclick = () => decide(d, "rejected", $("#why").value);
  $("#cancel").onclick = () => { $("#rejectBox").innerHTML = ""; };
}

async function decide(d, v, comment) {
  const who = $("#who"); if (who) { me = who.value.trim(); try { localStorage.setItem("grasp.name", me); } catch {} }
  const res = await fetch("api/review", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ decision: d.id, author: me || "reviewer", verdict: v, comment }) });
  if (!res.ok) return;
  R[d.id] = await res.json();
  renderStrip(d.id);
  setTimeout(() => { open = ""; idx = nextPending(idx); render(); }, 450);
}

function nextPending(from) {
  for (let i = from + 1; i < items.length; i++) if (!items[i].unexplained && !verdict(items[i].id)) return i;
  for (let i = 0; i < items.length; i++) if (!items[i].unexplained && !verdict(items[i].id)) return i;
  return items.length;
}
function move(step) { open = ""; idx = Math.max(0, Math.min(items.length, idx + step)); render(); }

async function renderDone() {
  const rev = items.filter(d => !d.unexplained), a = rev.filter(d => verdict(d.id) === "approved").length, r = rev.filter(d => verdict(d.id) === "rejected").length;
  const fb = r || rev.some(d => (R[d.id]?.comments || []).length) ? await (await fetch("api/feedback")).text() : "";
  $("#main").innerHTML = `<div class="card done in">
    <div class="big-ico">${r ? "📝" : "🎉"}</div>
    <h1>All decisions reviewed</h1>
    <div class="tally"><div><b style="color:var(--ok)">${a}</b>approved</div><div><b style="color:var(--bad)">${r}</b>rejected</div></div>
    <p>${r ? "Next time the agent starts, it reads your feedback and fixes what you rejected." : "Nothing to fix. The agent's work matches what you wanted."}</p>
    ${fb ? `<details><summary style="cursor:pointer;color:var(--mute)">What the agent will read</summary><pre class="fb">${esc(fb)}</pre></details>` : ""}
    <div class="row" style="justify-content:center;margin-top:18px"><button class="btn" id="again">Look again from the start</button></div></div>`;
  $("#again").onclick = () => { idx = 0; render(); };
}

// Watch: the session as one sentence at a time.
function steps() { return S.events.filter(e => !["read", "tool"].includes(e.kind)); }
function sentence(e) {
  const who = S.agent === "claude-code" ? "Claude" : "The agent";
  switch (e.kind) {
    case "prompt": return ["💬", "You asked", e.text];
    case "say": return ["🗨", `${who} said`, e.text];
    case "feedback": return ["📥", `${who} checked for your review feedback`, ""];
    case "decision": { const d = S.decisions.find(d => d.id === e.decision_id); const k = KINDS[d?.kind] || KINDS.other; return [k[0], `${who} decided: ${short(e.text)}`, d ? firstSentence(d.why) : ""]; }
    case "edit": { const c = counts(e); return ["✎", `${who} ${e.new_file ? "created" : "changed"} ${e.file}`, e.new_file ? `${c.add} lines` : `+${c.add} −${c.del} lines`]; }
    case "command": return [e.failed ? "⛔" : "▶", `${who} ran a command${e.failed ? ", and it failed" : ""}`, e.text];
    default: return ["⚙", e.tool, ""];
  }
}
function clip(s, n) { s = String(s || "").replace(/\s+/g, " "); return s.length > n ? s.slice(0, n - 1) + "…" : s; }
function renderWatch() {
  const st = steps(), p = Math.min(watch.pos, st.length - 1), e = st[p];
  if (!e) { $("#main").innerHTML = `<div class="card empty">Nothing to watch yet.</div>`; return; }
  const [ico, head, sub] = sentence(e);
  const past = st.slice(Math.max(0, p - 3), p).map(x => { const [i, h] = sentence(x); return `<div class="past"><span>${i}</span><span>${esc(clip(h, 90))}</span></div>`; }).join("");
  $("#main").innerHTML = `<div class="card"><div class="player">${past}
    <div class="now in"><div class="ico">${ico}</div><div class="txt">${esc(clip(head, 110))}${sub ? `<small>${esc(clip(sub, 200))}</small>` : ""}</div></div></div>
    <div class="bar"><i style="width:${((p + 1) / st.length * 100).toFixed(1)}%"></i></div>
    <div class="controls"><button class="btn" id="prev">◀</button><button class="btn primary" id="pp">${watch.timer ? "❚❚ Pause" : "▶ Play"}</button><button class="btn" id="nx">▶</button>
      <span class="step">step ${p + 1} of ${st.length}</span></div></div>`;
  const decId = e.decision_id || (e.kind === "edit" && S.unexplained.includes(e.seq) ? UNEXPLAINED : "");
  if (decId) renderStrip(decId);
  $("#pp").onclick = togglePlay;
  $("#prev").onclick = () => { stopPlay(); watch.pos = Math.max(0, p - 1); renderWatch(); };
  $("#nx").onclick = () => { stopPlay(); watch.pos = Math.min(st.length - 1, p + 1); renderWatch(); };
}
function stopPlay() { clearInterval(watch.timer); watch.timer = null; }
function togglePlay() {
  if (watch.timer) { stopPlay(); return renderWatch(); }
  if (watch.pos >= steps().length - 1) watch.pos = 0;
  watch.timer = setInterval(() => { if (watch.pos >= steps().length - 1) stopPlay(); else watch.pos++; renderWatch(); }, 1600);
  renderWatch();
}

function setTab() { document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.tab === tab)); }
document.querySelectorAll(".tab").forEach(t => t.onclick = () => { tab = t.dataset.tab; stopPlay(); setTab(); render(); if (tab === "watch" && watch.pos === 0) togglePlay(); });
$("#sessions").onchange = e => { sessionId = e.target.value; stopPlay(); load(); };
document.addEventListener("keydown", e => {
  if (!S || tab !== "review" || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  const d = items[idx];
  if (e.key === "ArrowRight") move(1);
  else if (e.key === "ArrowLeft") move(-1);
  else if (e.key === "a" && d && !d.unexplained) decide(d, "approved", "");
  else if (e.key === "r" && d && !d.unexplained) { e.preventDefault(); askReject(d); }
});
load().then(() => {
  try { const es = new EventSource("api/live"); let first = true;
    es.onmessage = () => { if (first) { first = false; return; } if (!watch.timer && !$("#rejectBox")?.innerHTML) load(true); }; } catch {}
});
</script>
</body>
</html>
