name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: build
        run: |
          v=${GITHUB_REF_NAME#v}
          mkdir dist
          for t in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os=${t%/*}; arch=${t#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$v" -o grasp ./cmd/grasp
            tar -czf dist/grasp_${v}_${os}_${arch}.tar.gz grasp LICENSE README.md
            mkdir -p mcpb/server && mv grasp mcpb/server/grasp-$os-$arch
          done
          # MCP bundle (for the MCP Registry and Claude Desktop): all binaries plus a picker
          cp packaging/mcpb/grasp mcpb/server/grasp
          sed "s/VERSION/$v/" packaging/mcpb/manifest.json > mcpb/manifest.json
          cp LICENSE mcpb/
          (cd mcpb && zip -qr ../dist/grasp-$v.mcpb .)
          (cd dist && sha256sum *.tar.gz > checksums.txt)
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
